name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm のバージョンはルート package.json の packageManager を読む
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # VS Code 拡張のバンドル(Extension Host + Webview)が壊れていないことを確認
      - run: pnpm --dir apps/vscode build

  # 実 VS Code(Electron)を起動する統合テスト(VS-6)。GUI が無いので xvfb で起動する
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm --dir apps/vscode test:integration

  # 開発用配布物(.vsix)を生成し、Actions の artifact としてダウンロード可能にする(VS-8)
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/vscode package
      - uses: actions/upload-artifact@v4
        with:
          name: beamer-editor-vsix
          path: apps/vscode/beamer-editor.vsix

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm のバージョンはルート package.json の packageManager を読む
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # VS Code 拡張のバンドル(Extension Host + Webview)が壊れていないことを確認
      - run: pnpm --dir apps/vscode build

  # 実 VS Code(Electron)を起動する統合テスト(VS-6)。GUI が無いので xvfb で起動する
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm --dir apps/vscode test:integration

  # 開発用配布物(.vsix)を生成し、Actions の artifact としてダウンロード可能にする(VS-8)。
  # プラットフォーム別に Tectonic の公式バイナリを同梱する(#130)。universal は同梱なし(対象外の環境向け)。
  vsix:
    name: vsix (${{ matrix.target }})
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64, win32-x64, universal]
        include:
          - target: win32-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Windows でも配布スクリプトの回帰テストを実行する
        if: runner.os == 'Windows'
        run: pnpm --dir apps/vscode exec vitest run test/packaging-scripts.test.ts
      # 絶対パス・空白を含む出力先を全ターゲットで使う。
      - run: pnpm --dir apps/vscode package -- --target ${{ matrix.target }} --out "${{ runner.temp }}/beamer-editor-${{ matrix.target }} build.vsix"
      - name: 同梱した Tectonic と再配布用の LICENSE / NOTICE が VSIX に入っていることを確かめる
        if: matrix.target != 'universal' && runner.os != 'Windows'
        run: |
          entries=$(unzip -l "${{ runner.temp }}/beamer-editor-${{ matrix.target }} build.vsix")
          for name in 'extension/bin/tectonic$' 'extension/bin/tectonic-LICENSE\.txt$' 'extension/bin/tectonic-NOTICE\.md$'; do
            echo "$entries" | grep -E "$name" || { echo "$name が VSIX に無い"; exit 1; }
          done
      - name: Windows の VSIX に Tectonic と LICENSE / NOTICE が入っていることを確かめる
        if: runner.os == 'Windows'
        run: |
          $entries = tar -tf "${{ runner.temp }}/beamer-editor-${{ matrix.target }} build.vsix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'extension/bin/tectonic.exe', 'extension/bin/tectonic-LICENSE.txt', 'extension/bin/tectonic-NOTICE.md') {
            if ($entries -notcontains $name) { throw "$name が VSIX に無い" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: beamer-editor-vsix-${{ matrix.target }}
          path: ${{ runner.temp }}/beamer-editor-${{ matrix.target }} build.vsix

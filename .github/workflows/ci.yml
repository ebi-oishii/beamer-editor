name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm のバージョンはルート package.json の packageManager を読む
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # VS Code 拡張のバンドル(Extension Host + Webview)が壊れていないことを確認
      - run: pnpm --dir apps/vscode build

  # 実 VS Code(Electron)を起動する統合テスト(VS-6)。GUI が無いので xvfb で起動する
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm --dir apps/vscode test:integration

  # 開発用配布物(.vsix)を生成し、Actions の artifact としてダウンロード可能にする(VS-8)。
  # プラットフォーム別に Tectonic の公式バイナリを同梱する(#130)。universal は同梱なし(対象外の環境向け)。
  vsix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64, win32-x64, universal]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/vscode package -- --target ${{ matrix.target }} --out beamer-editor-${{ matrix.target }}.vsix
      - name: 同梱した Tectonic が VSIX に入っていることを確かめる
        if: matrix.target != 'universal'
        run: unzip -l apps/vscode/beamer-editor-${{ matrix.target }}.vsix | grep -E 'extension/bin/tectonic(\.exe)?$'
      - uses: actions/upload-artifact@v4
        with:
          name: beamer-editor-vsix-${{ matrix.target }}
          path: apps/vscode/beamer-editor-${{ matrix.target }}.vsix
